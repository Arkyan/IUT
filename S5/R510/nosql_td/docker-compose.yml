services:
  mongodb:
    image: mongo:7.0
    container_name: mongo_td
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7.2
    container_name: redis_td
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  cassandra:
    image: cassandra:4.1
    container_name: cassandra_td
    ports:
      - "9042:9042"
    environment:
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
    volumes:
      - cassandra_data:/var/lib/cassandra
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 15s
      timeout: 10s
      retries: 10

  neo4j:
    image: neo4j:5.15
    container_name: neo4j_td
    ports:
      - "7474:7474" # interface web
      - "7687:7687" # protocole Bolt
    environment:
      - NEO4J_AUTH=neo4j/motdepasse123   
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
  cassandra_data:
  neo4j_data:
